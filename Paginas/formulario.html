<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../Estilos/style.css" />

    <title>formulario</title>
  </head>
  <body>
    <header
      class="container-fluid d-flex justify-content-around align-items-center py-3 bg-dark"
    >
      <a href="index.html">
        <img src="../media/logo.png" alt="" id="logo" />
      </a>
      <nav>
        <ul class="d-flex gap-4 list-unstyled m-0">
          <li>
            <a
              class="link-light link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover"
              href="index.html"
              >Inicio</a
            >
          </li>
          <li>
            <a
              class="link-light link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover"
              href="formulario.html"
              >Formulario</a
            >
          </li>
          <li>
            <a
              class="link-light link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover"
              href="historial_eventos.html"
              >Eventos</a
            >
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <div>
        <label for="text">Nombre:</label>
        <input type="text" id="text" name="text" required />
      </div>

      <div>
        <label for="text">Apellido:</label>
        <input type="text" id="text" name="text" required />
      </div>

      <div>
        <label for="email">Correo:</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          placeholder="ejemplo@dominio.com"
        />
      </div>

      <div>
        <label for="number">Teléfono:</label>
        <input type="number" id="number" name="number" required />
      </div>

      <div>
        <label for="opciones">Evento seleccionado:</label>
        <select name="opciones" id="opciones" required>
          <option value="opcion1">1 evento</option>
          <option value="opcion2">2 evento</option>
          <option value="opcion3">3 evento</option>
        </select>
      </div>
      <div><input type="submit" value="Submit" /></div>
    </main>
    <footer>
      <p>2026 Todos los derechos reservados.</p>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
